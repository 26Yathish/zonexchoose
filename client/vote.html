<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vote | Zonexchoose</title>
    <link rel="icon" href="/assets/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body data-page="vote">
    <a class="skip-link" href="#mainContent">Skip to main content</a>
    <div class="app-shell">
      <div class="container pb-5">
        <nav class="navbar navbar-expand-lg glass-nav" aria-label="Primary">
          <a class="navbar-brand" href="/">
            <img src="/assets/logo.svg" alt="Zonexchoose logo" class="brand-mark" />
            <div>
              <div class="brand-title">Zonexchoose</div>
              <small>Secure Vote Booth</small>
            </div>
          </a>
          <div class="ms-auto nav-toggle-group">
            <button type="button" class="btn btn-sm" data-theme-toggle><span data-theme-label>Theme: Midnight</span></button>
            <button type="button" class="btn btn-sm" data-voice-toggle><span data-voice-label>Voice: On</span></button>
            <a href="/dashboard.html" class="btn btn-sm">Dashboard</a>
            <button type="button" class="btn btn-sm" data-logout>Logout</button>
          </div>
        </nav>

        <main id="mainContent" class="page-section">
          <div class="glass-card p-4 p-lg-5">
            <div class="row g-4 align-items-center mb-4">
              <div class="col-lg-8">
                <span class="section-eyebrow mb-3">One Person • One Vote</span>
                <h1 class="page-title mb-2">Cast your choice with confidence.</h1>
                <p class="section-copy mb-0">Only approved candidates are listed below. Results remain locked until the administrator publishes them.</p>
              </div>
              <div class="col-lg-4">
                <div class="panel-card text-lg-end">
                  <p class="muted-text mb-1">Live turnout</p>
                  <h2 id="voteTurnout" class="h4 mb-0">Loading turnout...</h2>
                </div>
              </div>
            </div>

            <div id="voteStatusBanner" class="mb-4"></div>

            <form id="voteForm">
              <div id="candidateGrid" class="candidate-grid mb-4" role="radiogroup" aria-label="Approved candidates"></div>
              <button type="submit" id="castVoteBtn" class="btn btn-lg">Cast Secure Vote</button>
            </form>
          </div>
        </main>
      </div>

      <div id="loadingOverlay" class="loading-overlay" aria-hidden="true">
        <div class="spinner-card">
          <div class="spinner-border text-light mb-3" aria-hidden="true"></div>
          <p class="mb-0" data-loader-text>Working securely...</p>
        </div>
      </div>
    </div>

    <script src="/js/main.js"></script>
    <script src="/js/vote.js"></script>
  </body>
</html>
